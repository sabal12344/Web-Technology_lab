<!DOCTYPE html>
<html>
    <head>
        <Style>
            body{
                margin:0;
            }
            div{
                display:flex;
                justify-content: center;
                align-items: center;
                
                
            }
            .Contentbox{
                display:flex;
            }
            #c1{
                
               
                background-color:rgb(255, 185, 126);
            }
            #c2{                

                background-color:rgb(143, 187, 216);

            }
            #c3{

                background-color:rgb(127, 217, 166);

            }
            #c4{
                background-color:rgb(229, 150, 135);

            }
            #c5{
                background-color:rgb(229, 203, 118);

            }
            #c6{
                background-color:rgb(174, 170, 229);

            }
            #first div{
                height:150px;
                width:100%;

            }
            #second div{
                width:50%;
                height:250px;

            }
            #third div{
                width:34%;
                height:200px;

            }


        </Style>

    </head>
    <body>
        <div class="Contentbox" id="first">
            <div id="c1"> Content Area 1 </div>
            

        </div>




        <div class="Contentbox" id="second">
            <div id="c2" >Content Area 2</div>
            <div id="c3">Content Area 3</div>

        </div>




        <div class="Contentbox" id="third">
            <div id="c4">Content Area 4</div>
            <div id="c5">Content Area 5</div>
            <div id="c6">Content Area 6</div>
        </div>
    </body>


</html>
