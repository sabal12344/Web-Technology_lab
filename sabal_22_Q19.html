<!DOCTYPE html>
<html>
<head>
<title>Team Members</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#2f2d31;
}

.container{
    text-align:center;
    color:white;
    padding:20px;
}

.team{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.card{
    background:white;
    color:black;
    width:120px;
    padding:10px;
}

.card img{
    width:60px;
    height:60px;
    border-radius:50%;
}

@media(max-width:600px){
    .team{
        flex-direction:column;
        align-items:center;
    }
}
</style>

</head>
<body>

<div class="container">
    <h2>Our Team Members</h2>

    <div class="team">

        <div class="card">
            <img src="img1.jpeg">
            <h4>Norman</h4>
            <p>Programer</p>
        </div>

        <div class="card">
            <img src="img2.jpg">
            <h4>Jason</h4>
            <p>CEO</p>
        </div>

        <div class="card">
            <img src="img3.jpg">
            <p>Manager</p>
        </div>

        <div class="card">
            <img src="img4.jpg">
            <h4>Fahven</h4>
            <p>HR</p>
        </div>

    </div>
</div>

</body>
</html>
