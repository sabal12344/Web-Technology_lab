<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Menu</title>

    <style>

        .navbar{
            background-color:black;
            padding:10px;
            display:flex;
        }

        .nav-item{
            list-style:none;
            position:relative;
            margin-right:20px;
        }

        .nav-link{
            text-decoration:none;
            color:white;
            padding:10px;
            display:block;
        }

        .nav-link:hover{
            background-color:gray;
        }

        .dropdown-menu{
            display:none;
            position:absolute;
            top:100%;
            left:0;
            background-color:white;
            border:1px solid black;
            width:150px;
        }

        .nav-item:hover .dropdown-menu{
            display:block;
        }

        .dropdown-item{
            display:block;
            text-decoration:none;
            color:black;
            padding:8px;
        }

        .dropdown-item:hover{
            background-color:lightgray;
        }

        .arrow{
            font-size:12px;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <li class="nav-item">
            <a href="#" class="nav-link">Home</a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link">
                Services <span class="arrow">▼</span>
            </a>

            <div class="dropdown-menu">
                <a href="#" class="dropdown-item">Web Design</a>
                <a href="#" class="dropdown-item">Development</a>
                <a href="#" class="dropdown-item">SEO & Marketing</a>
            </div>

        </li>

        <li class="nav-item">

            <a href="#" class="nav-link">
                Company <span class="arrow">▼</span>
            </a>

            <div class="dropdown-menu">
                <a href="#" class="dropdown-item">Our Story</a>
                <a href="#" class="dropdown-item">Careers</a>
                <a href="#" class="dropdown-item">Contact Us</a>
            </div>

        </li>

        <li class="nav-item">
            <a href="#" class="nav-link">About</a>
        </li>

    </nav>

</body>

</html>
