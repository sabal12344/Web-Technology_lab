<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                margin:0;
            }
            #header{
                text-align: center;
                width:100%;
                height:60px;
                background-color: rgb(84, 84, 135);
            }
            #nav{
                width: 100%;
                height: 40px;
                background-color: rgb(135, 152, 135);


            }
            #left{
                width: 25%;
                height:480px;
                float:left;
                background-color: rgb(170, 84, 85);

            }
            #center{
                width: 50%;
                height: 480px;
                float:left;

                background-color: rgb(0, 170, 255);

            }
            #right{
                width: 25%;
                height:480px;
                float:left;

                background-color: rgb(135, 120, 255);
            }


            #footer{
                clear:both;
                height: 60px;
               
                background-color: rgb(135, 135, 135);

            }
        </style>
    </head>
    <body>
        <div id="header">Header</div>
        <div id="nav">Menu</div>
        <div id="left">Left Side</div>
        <div id="center">Centre</div>
        <div id="right">Right Side</div>
        <div id="footer">Footer</div>
    </body>
</html>
