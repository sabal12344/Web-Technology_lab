<!DOCTYPE html>
<html>
<head>
<title>Image Gallery</title>

<style>
body{
    font-family:Arial;
    text-align:center;
}

h2{
    color:gray;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    width:80%;
    margin:auto;
}

.item img{
    width:100%;
    height:120px;
    transition:0.5s;
}

.item p{
    font-size:12px;
}

/* Hover Effects */
.zoom:hover img{
    transform:scale(1.1);
}

.fade:hover img{
    opacity:0.5;
}

.blur:hover img{
    filter:blur(3px);
}

.mask:hover img{
    filter:brightness(50%);
}

.zoomout:hover img{
    transform:scale(0.9);
}

.blurout:hover img{
    filter:grayscale(100%);
}

.overlay{
    position:relative;
}

.overlay span{
    position:absolute;
    top:45%;
    left:25%;
    color:white;
    display:none;
}

.overlay:hover span{
    display:block;
}

.fall:hover img{
    transform:translateY(10px);
}
</style>

</head>
<body>

<h2>HOVER-EFFECT CSS</h2>

<div class="gallery">

    <div class="item zoom">
        <img src="tiger.jfif">
        <p>Hover-Zoomin</p>
    </div>

    <div class="item fade">
        <img src="goat.webp">
        <p>Hover-Fade</p>
    </div>

    <div class="item blur">
        <img src="grasshopper.webp">
        <p>Hover-Blur</p>
    </div>

    <div class="item mask">
        <img src="tiger.jfif">
        <p>Hover-Mask</p>
    </div>

    <div class="item zoomout">
        <img src="goat.webp">
        <p>Hover-Zoomout</p>
    </div>

    <div class="item blurout">
        <img src="grasshopper.webp">
        <p>Hover-Blurout</p>
    </div>

    <div class="item overlay">
        <img src="tiger.jfif">
        <span>Overlay Text</span>
        <p>Overlay Text</p>
    </div>

    <div class="item fall">
        <img src="grasshopper.webp">
        <p>Hover-Fall</p>
    </div>

</div>

</body>
</html>
