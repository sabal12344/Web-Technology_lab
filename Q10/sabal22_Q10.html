<!DOCTYPE html>
<html>
    <head>
        <style>

            
            div{
                display:flex;
                justify-content: center;
                align-items: center;
            }
           
            #centre,#top,#bottom{
                padding:50px;
            }

            
            button{
                width: 100px;
                height:50px;
                background-color: green;
                color:white;
                padding-right:20px;
                padding-left:20px;
                margin:1;
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
                font-size:large;
            }
            #result{
                 width: 100px;
                height:50px;
                background-color: white;
                color:black;
                padding-right:20px;
                padding-left:20px;
                margin:1;
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.7);
                margin-left:50px;
                margin-right:50px;
                font-size: large;



            }
        </style>

    </head>
    <body>

        <div id="top"><h1>Counter APP</h1></div>

        

        <div id="centre">
            <button id="plus-button">+</button>
            <div id="result">0</div>
            <button id="minus-button">-</button>

        </div>

        <div id="bottom">
            <button id="reset-button">Reset</button>
        </div>



        <script src="sabal22_Q10.js">

        </script>
    </body>
</html>
